  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-orange-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Check if running in development preview, Cloud Run proxy, or iframe
          var isDevOrPreview =
            window.location.hostname.includes('run.app') ||
            window.location.hostname.includes('localhost') ||
            window.location.hostname === '127.0.0.1' ||
            window.self !== window.top;

          if (isDevOrPreview) {
            // Unregister any service workers in preview / dev iframe to avoid script load errors
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              registrations.forEach(function (reg) {
                reg.unregister();
              });
            }).catch(function () {});
            return;
          }

          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .then((registration) => {
              // Immediately check for updates on page load
              registration.update().catch(() => {});

              // When a new version is detected, tell the worker to activate immediately
              registration.addEventListener('updatefound', () => {
                const installingWorker = registration.installing;
                if (installingWorker) {
                  installingWorker.addEventListener('statechange', () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      installingWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  });
                }
              });
            })
            .catch((error) => {
              console.warn('PWA Service Worker registration skipped:', error);
            });

          // Smoothly reload the page when the new Service Worker activates
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
